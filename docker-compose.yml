services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8011:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Takes precedence over .env: the container always listens on 8000.
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
