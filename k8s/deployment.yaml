apiVersion: apps/v1
kind: Deployment
metadata:
  name: ucp-merchant-server
  labels:
    app: ucp-merchant-server
    project: ai-engineer-portfolio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ucp-merchant-server
  template:
    metadata:
      labels:
        app: ucp-merchant-server
    spec:
      containers:
        - name: ucp-merchant-server
          image: ucp-merchant-server:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
            - name: MERCHANT_NAME
              valueFrom:
                configMapKeyRef:
                  name: ucp-merchant-config
                  key: merchant-name
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: ucp-merchant-server
  labels:
    app: ucp-merchant-server
spec:
  type: ClusterIP
  ports:
    - port: 8011
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: ucp-merchant-server
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ucp-merchant-config
data:
  merchant-name: "TechVault Electronics"
